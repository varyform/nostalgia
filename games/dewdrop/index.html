<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dewdrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* the bars around the game on screens of another shape (@nostalgia/game backdrop) */
:root { --backdrop-top: #070717; --backdrop-bottom: #100f26; }
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #05060f; }
</style>
</head>

<canvas id="c"></canvas>

</body>

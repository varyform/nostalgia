<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Netcord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700;800&family=Righteous&display=swap" rel="stylesheet">
<style>
/* the bars around the game on screens of another shape (@nostalgia/game backdrop) */
:root { --backdrop-top: #1d2a22; --backdrop-bottom: #1a3528; }
  html, body { margin: 0; height: 100%; background: #061a12; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { display: grid; place-items: center; }
  canvas { display: block; grid-area: 1 / 1; }
  #gl { background: #0b2a1c; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>

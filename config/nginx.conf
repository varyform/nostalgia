# Behind kamal-proxy, which forwards plain HTTP on :80 (Cloudflare terminates TLS).

server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  # Relative redirects, or nginx would send http://…:80 URLs.
  absolute_redirect off;

  # The .gz copies made in the Dockerfile.
  gzip_static on;

  # kamal-proxy's health check.
  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Page names don't change between builds: revalidate every time, so a deploy shows at once.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }
}
